services:
  mongo:
    image: mongo:7
    container_name: login-flow-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  api:
    build:
      context: ./api
    container_name: login-flow-api
    restart: unless-stopped
    depends_on:
      - mongo
    env_file:
      - ./.env
    ports:
      - "${PORT:-4000}:${PORT:-4000}"

  web:
    build:
      context: ./web
    container_name: login-flow-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
    ports:
      - "5173:5173"

volumes:
  mongo-data:
